<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-to-Spread PDF Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; 
            background: #1a1a1a; /* 全体の背景色 */
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
        }
        .viewer-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; }
        
        /* ビューワー（本）のサイズ設定 */
        .swiper { 
            width: 100%; 
            max-width: 950px; /* 見開きの際の上限横幅 */
            height: 80vh; 
            max-height: 580px; 
            background: #1a1a1a; 
        }
        
        .swiper-slide { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #1a1a1a;
            width: 100%;
        }
        
        /* 縦長画像が綺麗に2枚並ぶように調整 */
        .swiper-slide canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); /* 各ページに薄い影をつけて立体感を出す */
        }
        
        /* 左右ボタンのデザイン */
        .swiper-button-next, .swiper-button-prev { color: #ffffff; background: rgba(0,0,0,0.5); width: 44px; height: 44px; border-radius: 50%; }
        .swiper-button-next:after, .swiper-button-prev:after { font-size: 18px; font-weight: bold; }
        
        /* 下部カウンター */
        .page-counter { margin-top: 15px; font-size: 13px; color: #eee; background: #333; padding: 5px 16px; border-radius: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        #loading { position: absolute; color: #ffffff; font-size: 14px; z-index: 10; background: rgba(0,0,0,0.6); padding: 12px 24px; border-radius: 25px; }
    </style>
</head>
<body>

<div class="viewer-container">
    <div id="loading">フォトブックを読み込み中...</div>
    
    <div class="swiper" dir="rtl" style="display:none;">
        <div class="swiper-wrapper" id="swiper-wrapper">
            </div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>
    
    <div class="page-counter" id="counter-box" style="display:none;">
        <span id="current-page">1</span> / <span id="total-pages">0</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfUrl = 'book.pdf'; // 1ページずつのPDFファイル名
    const wrapper = document.getElementById('swiper-wrapper');

    pdfjsLib.getDocument(pdfUrl).promise.then(async function(pdf) {
        const totalPages = pdf.numPages;
        document.getElementById('total-pages').textContent = totalPages;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const slide = document.createElement('div');
            slide.className = 'swiper-slide';
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            // 縦長ページを鮮明に表示させるため scale: 2.5
            const viewport = page.getViewport({ scale: 2.5 }); 
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = { canvasContext: context, viewport: viewport };
            await page.render(renderContext).promise;
            
            slide.appendChild(canvas);
            wrapper.appendChild(slide);
        }

        document.getElementById('loading').style.display = 'none';
        document.querySelector('.swiper').style.display = 'block';
        document.getElementById('counter-box').style.display = 'block';

        // 自動見開き・レスポンシブ制御付きのSwiper初期化
        const swiper = new Swiper('.swiper', {
            rtl: true,
            loop: false,
            speed: 400,
            grabCursor: true,
            
            // 【超重要】画面幅に応じた表示数の切り替え設定（ブレイクポイント）
            slidesPerView: 1,      // 基本（スマホ等の縦画面）は1ページずつ表示
            slidesPerGroup: 1,     // 1回で進むページ数
            
            breakpoints: {
                768: {             // 画面横幅が768px以上（PCやタブレット横）のとき
                    slidesPerView: 2,  /* 左右に2ページ同時に並べる */
                    slidesPerGroup: 2  /* 矢印を押した時に2ページずつ進む */
                }
            },
            
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            keyboard: { enabled: true },
            on: {
                slideChange: function () {
                    // パソコン表示（見開き）のときはカウンターの計算を調整
                    let current = this.activeIndex + 1;
                    if (window.innerWidth >= 768) {
                        current = Math.ceil(current / 2) * 2 - 1;
                        if(current < 1) current = 1;
                        document.getElementById('current-page').textContent = current + "-" + (current + 1);
                    } else {
                        document.getElementById('current-page').textContent = current;
                    }
                }
            }
        });

        // 初期のカウンター表示をPC用に調整
        if (window.innerWidth >= 768) {
            document.getElementById('current-page').textContent = "1-2";
        }

    }).catch(function(error) {
        console.error('PDF読み込みエラー: ', error);
        document.getElementById('loading').textContent = 'PDFファイルの読み込みに失敗しました。';
    });
</script>

</body>
</html>
