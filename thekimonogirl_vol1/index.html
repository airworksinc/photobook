<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklet Style PDF Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; 
            background: #1a1a1a; /* 全体の背景色 */
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
        }
        .viewer-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; }
        
        .swiper { 
            width: 100%; 
            max-width: 950px; 
            height: 80vh; 
            max-height: 580px; 
            background: #1a1a1a; 
        }
        
        .swiper-slide { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #1a1a1a;
        }
        
        /* 1P表示（表紙・裏表紙）の時は、中央に綺麗に収まるように幅を制限 */
        .swiper-slide.single-page canvas {
            max-width: 50%;
        }
        
        .swiper-slide canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); /* ページに立体感のある影をつける */
        }
        
        /* 左右ボタンのデザイン */
        .swiper-button-next, .swiper-button-prev { color: #ffffff; background: rgba(0,0,0,0.5); width: 44px; height: 44px; border-radius: 50%; }
        .swiper-button-next:after, .swiper-button-prev:after { font-size: 18px; font-weight: bold; }
        
        /* 下部カウンター */
        .page-counter { margin-top: 15px; font-size: 13px; color: #eee; background: #333; padding: 5px 16px; border-radius: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        #loading { position: absolute; color: #ffffff; font-size: 14px; z-index: 10; background: rgba(0,0,0,0.6); padding: 12px 24px; border-radius: 25px; }
    </style>
</head>
<body>

<div class="viewer-container">
    <div id="loading">フォトブックを読み込み中...</div>
    
    <div class="swiper" dir="rtl" style="display:none;">
        <div class="swiper-wrapper" id="swiper-wrapper">
            </div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>
    
    <div class="page-counter" id="counter-box" style="display:none;">
        <span id="current-page">表紙</span> / <span id="total-pages">0</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfUrl = 'book.pdf'; 
    const wrapper = document.getElementById('swiper-wrapper');

    pdfjsLib.getDocument(pdfUrl).promise.then(async function(pdf) {
        const totalPages = pdf.numPages;
        document.getElementById('total-pages').textContent = totalPages + "P";

        // 全ページ分のCanvas（画像データ）を一時的に配列に保持する
        const pagesData = [];
        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const viewport = page.getViewport({ scale: 2.5 }); 
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = { canvasContext: context, viewport: viewport };
            await page.render(renderContext).promise;
            pagesData.push(canvas);
        }

        // --- パソコン（見開き仕様）用にスライドの構造を手動で組み立てる ---
        
        // ① 1ページ目：表紙（独立した1枚のスライドとして作成）
        const coverSlide = document.createElement('div');
        coverSlide.className = 'swiper-slide single-page';
        coverSlide.appendChild(pagesData[0]);
        coverSlide.setAttribute('data-page-label', '表紙');
        wrapper.appendChild(coverSlide);

        // ② 2ページ目から、最後から2番目のページまでを「2枚ペア」でスライドにしていく
        for (let i = 1; i < totalPages - 1; i += 2) {
            const pairSlide = document.createElement('div');
            pairSlide.className = 'swiper-slide';
            
            // 右開きの本なので、奇数ページ（右）を先に、偶数ページ（左）を後に並べる
            if (pagesData[i]) pairSlide.appendChild(pagesData[i]);
            if (pagesData[i+1]) pairSlide.appendChild(pagesData[i+1]);
            
            pairSlide.setAttribute('data-page-label', `${i+1}-${i+2}P`);
            wrapper.appendChild(pairSlide);
        }

        // ③ 最終ページ：裏表紙（奇数ページで終わる仕様に合わせて独立させる）
        if (totalPages > 1) {
            const backCoverSlide = document.createElement('div');
            backCoverSlide.className = 'swiper-slide single-page';
            backCoverSlide.appendChild(pagesData[totalPages - 1]);
            backCoverSlide.setAttribute('data-page-label', '裏表紙');
            wrapper.appendChild(backCoverSlide);
        }

        document.getElementById('loading').style.display = 'none';
        document.querySelector('.swiper').style.display = 'block';
        document.getElementById('counter-box').style.display = 'block';

        // Swiper初期化
        const swiper = new Swiper('.swiper', {
            rtl: true,
            loop: false,
            speed: 450,
            grabCursor: true,
            effect: 'slide',
            slidesPerView: 1, // 各スライド（表紙、または見開きペア）を画面に1つずつ出す
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            keyboard: { enabled: true },
            on: {
                slideChange: function () {
                    // 現在アクティブなスライドに設定されたページラベルを取得してカウンターに表示
                    const activeSlide = this.slides[this.activeIndex];
                    const label = activeSlide.getAttribute('data-page-label');
                    document.getElementById('current-page').textContent = label;
                }
            }
        });

    }).catch(function(error) {
        console.error('PDF読み込みエラー: ', error);
        document.getElementById('loading').textContent = 'PDFファイルの読み込みに失敗しました。';
    });
</script>

</body>
</html>
