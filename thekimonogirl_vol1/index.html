<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobook Viewer - Fixed Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#111;
  --surface:#1c1c1c;
  --border:rgba(255,255,255,0.08);
  --text:#e8e4dc;
  --muted:rgba(232,228,220,0.4);
  --accent:#c8a97e;
  --spine-w:6px;
}

html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}

/* ── レイアウト ── */
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:12px}

/* ── ローディング ── */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:100;transition:opacity 0.6s}
#loading.hide{opacity:0;pointer-events:none}
.load-ring{width:40px;height:40px;border:1.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load-txt{font-size:13px;letter-spacing:0.15em;color:var(--muted);font-style:italic}

/* ── ブック本体 ── */
#book-wrap{
  position:relative;
  width:100%;
  max-width:900px;
  height:clamp(300px,70vh,560px);
  display:flex;
  align-items:center;
  justify-content:center;
}

#book{
  position:relative;
  height:100%;
  display:flex;
  align-items:stretch;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

/* ページ切り替え時のアニメーション効果（タメの演出） */
.page-turning {
  opacity: 0.4;
  transform: scale(0.97);
}

/* 各ページの枠 */
.page {
  position:relative;
  height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1a1a1a;
}
.page canvas{
  max-width:100%;
  max-height:100%;
  display:block;
  object-fit: contain;
}

/* 綴じ部（中央の影） */
.spine-shadow{
  position:absolute;
  top:0;bottom:0;
  width:var(--spine-w);
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(to right,rgba(0,0,0,0.4),rgba(0,0,0,0.05),rgba(0,0,0,0.4));
  z-index:5;
  pointer-events:none;
}

/* パソコン用の基本サイズ（1Pと2Pで本の全体幅を調整） */
#book.single { width: clamp(150px, 35vw, 430px); }
#book.double { width: clamp(300px, 70vw, 860px); }

#book.single .page { width: 100%; }
#book.double .page { width: 50%; }

/* ── 【修正】スマホ表示のCSS競合を完全シャットアウト ── */
@media(max-width:767px){
  #book-wrap { height: 55vh; width: 100%; }
  #book.single, #book.double { width: 85vw !important; max-width: 360px; }
  #book.single .page, #book.double .page { width: 100% !important; }
  #page-left { display: none !important; }
  .spine-shadow { display: none !important; }
}

/* ── ナビゲーション矢印 ── */
.nav-btn{
  position:absolute;
  top:50%;transform:translateY(-50%);
  width:44px;height:44px;
  border:1px solid var(--border);
  border-radius:50%;
  background:rgba(17,17,17,0.8);
  color:var(--text);
  font-size:18px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color 0.2s,background 0.2s,opacity 0.2s;
  backdrop-filter:blur(4px);
  z-index:10;
  user-select:none;
}
.nav-btn:hover{border-color:var(--accent);background:rgba(200,169,126,0.15)}
.nav-btn:disabled{opacity:0.1;cursor:default;pointer-events:none;}
#btn-prev{right:calc(100% + 16px)}
#btn-next{left:calc(100% + 16px)}

/* スマホ：矢印を画面の下部へ避難 */
@media(max-width:767px){
  #btn-prev{right:10px;top:auto;bottom:-20px;transform:none}
  #btn-next{left:10px;top:auto;bottom:-20px;transform:none}
}

/* ── サムネイル ── */
#thumbs{
  display:flex;gap:8px;
  overflow-x:auto;
  width:100%;max-width:900px;
  padding:8px 4px;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
#thumbs::-webkit-scrollbar{height:4px}
#thumbs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.thumb{
  flex-shrink:0;
  width:44px;height:58px;
  border:1px solid var(--border);
  border-radius:2px;
  background:#2a2a2a;
  cursor:pointer;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  transition:border-color 0.2s,transform 0.15s;
  position:relative;
}
.thumb:hover{transform:translateY(-2px)}
.thumb.active{border-color:var(--accent);box-shadow: 0 0 8px rgba(200,169,126,0.4);}
.thumb canvas{max-width:100%;max-height:100%}

/* ── ページカウンター ── */
#counter{
  font-size:12px;letter-spacing:0.2em;color:var(--text);
  background: rgba(255,255,255,0.05);
  padding: 4px 14px;
  border-radius: 12px;
}
</style>
</head>
<body>

<div id="loading">
  <div class="load-ring"></div>
  <p id="load-txt">フォトブックを読み込み中...</p>
</div>

<div id="app" style="visibility:hidden">
  <div id="book-wrap">
    <button class="nav-btn" id="btn-prev" title="前のページ">&#8250;</button>

    <div id="book" class="single">
      <div class="page" id="page-right"></div>
      <div class="spine-shadow" id="spine" style="display:none"></div>
      <div class="page" id="page-left" style="display:none"></div>
    </div>

    <button class="nav-btn" id="btn-next" title="次のページ">&#8249;</button>
  </div>

  <div id="thumbs"></div>
  <p id="counter">－</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const PDF_URL='book.pdf';

let pdfDoc=null,totalPages=0,spread=0;
const pageRight=document.getElementById('page-right');
const pageLeft=document.getElementById('page-left');
const spine=document.getElementById('spine');
const book=document.getElementById('book');
const thumbsEl=document.getElementById('thumbs');
const counter=document.getElementById('counter');
const btnPrev=document.getElementById('btn-prev');
const btnNext=document.getElementById('btn-next');
const loading=document.getElementById('loading');
const app=document.getElementById('app');

const cache=new Map();

function isMobile() {
    return window.innerWidth < 768;
}

async function renderPage(pNum){
  if(cache.has(pNum)) return cache.get(pNum);
  const page=await pdfDoc.getPage(pNum);
  
  // スマホとPCで最適な画質スケールを設定
  const scale = isMobile() ? 1.5 : Math.min(2, window.devicePixelRatio || 1) * 1.5;
  const viewport=page.getViewport({scale});
  
  const canvas=document.createElement('canvas');
  canvas.width=viewport.width;
  canvas.height=viewport.height;
  canvas.style.maxWidth='100%';
  canvas.style.maxHeight='100%';
  
  await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
  cache.set(pNum,canvas);
  return canvas;
}

async function showInContainer(container,pNum){
  container.innerHTML='';
  if(!pNum||pNum<1||pNum>totalPages) return;
  const c=await renderPage(pNum);
  container.appendChild(c.cloneNode(true));
}

// スプレッド（表示位置）の割り当て計算
function spreadToPages(s){
  if (isMobile()) {
      return { right: s + 1, left: null }; // スマホは常に単一ページ扱い
  }
  if(s===0) return{right:1,left:null};
  const r=s*2, l=s*2+1;
  const hasLeft=l<=totalPages;
  if(r===totalPages&&!hasLeft) return{right:r,left:null};
  return{right:r,left:hasLeft?l:null};
}

function totalSpreads(){
  if (isMobile()) {
      return totalPages - 1;
  }
  return Math.ceil((totalPages-1)/2);
}

async function render(){
  // めくりアニメーション用のクラスを付与
  book.classList.add('page-turning');
  
  const{right,left}=spreadToPages(spread);
  const isSingle=!left || isMobile();

  // アニメーションの「タメ」を作ってから描画を切り替える
  setTimeout(async () => {
    book.className=isSingle?'single':'double';

    if(isSingle){
      spine.style.display='none';
      pageLeft.style.display='none';
    } else {
      spine.style.display='block';
      pageLeft.style.display='flex';
    }

    await showInContainer(pageRight,right);
    if(!isSingle) await showInContainer(pageLeft,left);

    // カウンターテキストの同期
    if(isMobile()){
      if(right===1) counter.textContent=`表紙 / ${totalPages}P`;
      else if(right===totalPages) counter.textContent=`裏表紙 / ${totalPages}P`;
      else counter.textContent=`${right} / ${totalPages}P`;
    } else {
      if(isSingle){
        counter.textContent=right===1?`表紙 / ${totalPages}P`:`裏表紙 / ${totalPages}P`;
      } else {
        counter.textContent=`${right} – ${left} / ${totalPages}P`;
      }
    }

    btnPrev.disabled=spread <= 0;
    btnNext.disabled=spread >= totalSpreads();
    updateThumbActive(right,left);

    // 前後ページの先読み
    prefetch(spread-1);
    prefetch(spread+1);

    // アニメーション終了（元に戻す）
    book.classList.remove('page-turning');
  }, 120); 
}

function prefetch(s){
  if(s<0||s>totalSpreads()) return;
  const{right,left}=spreadToPages(s);
  if(right) renderPage(right);
  if(left) renderPage(left);
}

function go(dir){
  const next=spread+dir;
  if(next<0||next>totalSpreads()) return;
  spread=next;
  render();
}

// キーボード
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') go(1);
  if(e.key==='ArrowRight') go(-1);
});

// サムネイル構築（時差レンダリングでスマホを保護）
async function buildThumbs(){
  thumbsEl.innerHTML='';
  for(let i=1;i<=totalPages;i++){
    const d=document.createElement('div');
    d.className='thumb';
    d.title=`${i}ページ`;
    d.dataset.page=i;
    thumbsEl.appendChild(d);
    
    d.onclick=()=>{
      if (isMobile()) {
          spread = i - 1;
      } else {
          if(i===1){spread=0;}
          else if(i===totalPages&&totalPages%2===0){spread=totalSpreads();}
          else{spread=Math.ceil((i-1)/2);}
      }
      render();
    };

    setTimeout(async()=>{
      try{
        const page=await pdfDoc.getPage(i);
        const vp=page.getViewport({scale:0.1});
        const c=document.createElement('canvas');
        c.width=vp.width;c.height=vp.height;
        await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        d.appendChild(c);
      }catch(e){}
    }, i * 25); 
  }
}

function updateThumbActive(right,left){
  document.querySelectorAll('.thumb').forEach(t=>{
    const p=parseInt(t.dataset.page);
    // スマホ時は右側のターゲット（1ページ）のみをアクティブ判定
    if(isMobile()) {
        t.classList.toggle('active', p === right);
    } else {
        t.classList.toggle('active', p === right || p === left);
    }
  });
  
  // アクティブなサムネイルまで滑らかに自動スクロール
  const activeThumb = document.querySelector('.thumb.active');
  if (activeThumb) {
      thumbsEl.scrollTo({
          left: activeThumb.offsetLeft - thumbsEl.offsetWidth / 2 + activeThumb.offsetWidth / 2,
          behavior: 'smooth'
      });
  }
}

// スワイプ操作
let touchStartX=0;
book.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});
book.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>40){
    go(dx>0?-1:1); // 右開き
  }
},{passive:true});

// リサイズ対応
let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        render();
    }, 150);
});

// 初期起動
(async()=>{
  try{
    pdfDoc=await pdfjsLib.getDocument(PDF_URL).promise;
    totalPages=pdfDoc.numPages;
    spread=0;
    loading.classList.add('hide');
    app.style.visibility='visible';
    await buildThumbs();
    await render();
  }catch(e){
    document.getElementById('load-txt').textContent='読み込みに失敗しました';
    console.error(e);
  }
})();

btnPrev.onclick=()=>go(-1);
btnNext.onclick=()=>go(1);
</script>
</body>
</html>
