<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding MUSE Vol.1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { width: 100%; height: 100%; background: rgba(26, 26, 26, 0.85); overflow: hidden; font-family: -apple-system, sans-serif; }
        .viewer-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; gap: 12px; }
        
        .swiper { width: 100%; max-width: 950px; height: 68vh; max-height: 520px; background: rgba(26, 26, 26, 0.85); }
        .swiper-slide { display: flex; justify-content: center; align-items: center; background: rgba(26, 26, 26, 0.85); width: 100% !important; }
        
        /* CSSは極めてシンプルに。画像は常にコンテナに100%フィットさせます */
        .swiper-slide canvas { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 8px 20px rgba(0,0,0,0.4); background: rgba(26, 26, 26, 0.85); }
        
        /* 表紙・裏表紙の単一縦長ページがPCで横に広がりすぎるのを防御 */
        .swiper-slide.single-page canvas { max-width: 50% !important; }

        .swiper-button-next, .swiper-button-prev { color: #ffffff; background: rgba(0,0,0,0.5); width: 44px; height: 44px; border-radius: 50%; z-index: 20; }
        .swiper-button-next:after, .swiper-button-prev:after { font-size: 18px; font-weight: bold; }
        .page-counter { margin-top: 5px; font-size: 13px; color: #eee; background: #333; padding: 5px 16px; border-radius: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); z-index: 20; }
        #loading { position: absolute; color: #ffffff; font-size: 14px; z-index: 100; background: rgba(0,0,0,0.6); padding: 12px 24px; border-radius: 25px; }

        #thumbs-container {
            display: flex; gap: 8px;
            overflow-x: auto;
            width: 100%; max-width: 900px;
            padding: 8px 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
            z-index: 30;
        }
        #thumbs-container::-webkit-scrollbar { height: 4px; }
        #thumbs-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        .thumb-box {
            flex-shrink: 0;
            width: 44px; height: 58px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2px;
            background: #2a2a2a;
            cursor: pointer;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.2s, transform 0.15s;
        }
        .thumb-box:hover { transform: translateY(-2px); }
        .thumb-box.active { border-color: #c8a97e; box-shadow: 0 0 8px rgba(200,169,126,0.5); }
        .thumb-box canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

        @media (max-width: 767px) {
            .swiper { height: 55vh; }
            .swiper-slide canvas { max-width: 100% !important; width: auto !important; object-fit: contain !important; }
            .swiper-button-next { right: 5px; }
            .swiper-button-prev { left: 5px; }
            #thumbs-container { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="viewer-container">
    <div id="loading">フォトブックを読み込み中...</div>
    
    <div class="swiper" dir="rtl" style="display:none;">
        <div class="swiper-wrapper" id="swiper-wrapper"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>
    
    <div class="page-counter" id="counter-box" style="display:none;"><span id="current-page">表紙</span> / <span id="total-pages">0</span></div>
    
    <div id="thumbs-container"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdfUrl = 'book.pdf'; 
    const wrapper = document.getElementById('swiper-wrapper');
    const thumbsContainer = document.getElementById('thumbs-container');
    let pdfDoc = null;
    let swiperInstance = null;

    function checkIsMobile() {
        return window.innerWidth < 768;
    }

    // ⭕【コアロジック刷新】横長見開きPDFを、スマホ表示の時だけプログラム側で物理的に真っ二つにカットして描画する処理
    async function renderPageToCanvas(pageNum, container) {
        const side = container.getAttribute('data-side') || 'both'; // 'right', 'left', 'both'
        const cacheKey = `${pageNum}-${side}`;
        if (container.querySelector(`[data-render-key="${cacheKey}"]`)) return;

        const page = await pdfDoc.getPage(pageNum);
        
        // 処理速度向上のためスケールは1.2（モバイルは1.0）
        const isMobile = checkIsMobile();
        const optimizedScale = isMobile ? 1.0 : 1.2;
        const viewport = page.getViewport({ scale: optimizedScale });

        // 一時的に裏側でPDFのオリジナルサイズを描画するための隠しCanvasを作成
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = viewport.width;
        tempCanvas.height = viewport.height;
        const tempContext = tempCanvas.getContext('2d');
        await page.render({ canvasContext: tempContext, viewport: viewport }).promise;

        // 実際に画面に配置するCanvasを作成
        const finalCanvas = document.createElement('canvas');
        finalCanvas.setAttribute('data-render-key', cacheKey);
        const finalContext = finalCanvas.getContext('2d');

        if (side === 'both') {
            // PC表示：そのまま全体をコピー
            finalCanvas.width = viewport.width;
            finalCanvas.height = viewport.height;
            finalContext.drawImage(tempCanvas, 0, 0);
        } else {
            // スマホ表示：横幅を半分にクリップして転写
            const halfWidth = viewport.width / 2;
            finalCanvas.width = halfWidth;
            finalCanvas.height = viewport.height;

            if (side === 'right') {
                // 右半分（偶数P）を切り出して転写
                finalContext.drawImage(tempCanvas, halfWidth, 0, halfWidth, viewport.height, 0, 0, halfWidth, viewport.height);
            } else if (side === 'left') {
                // 左半分（奇数P）を切り出して転写
                finalContext.drawImage(tempCanvas, 0, 0, halfWidth, viewport.height, 0, 0, halfWidth, viewport.height);
            }
        }

        container.appendChild(finalCanvas);
    }

    function buildSlides() {
        wrapper.innerHTML = '';
        const totalPages = pdfDoc.numPages;
        const isMobile = checkIsMobile();

        if (isMobile) {
            // 📱スマホ：見開きデータを「右半分」「左半分」の独立した箱として完全に分解して生成
            // 表紙（1ページ目）
            let slide = document.createElement('div');
            slide.className = 'swiper-slide single-page';
            slide.setAttribute('data-pages', JSON.stringify([1]));
            slide.setAttribute('data-side', 'both');
            slide.setAttribute('data-label', '表紙');
            wrapper.appendChild(slide);

            // 中身（2〜20ページ目）
            for (let i = 2; i < totalPages; i++) {
                const pageStart = (i - 1) * 2;
                
                // 右側（偶数P）用の独立したスライド
                let slideR = document.createElement('div');
                slideR.className = 'swiper-slide';
                slideR.setAttribute('data-pages', JSON.stringify([i]));
                slideR.setAttribute('data-side', 'right');
                slideR.setAttribute('data-label', `${pageStart}P`);
                wrapper.appendChild(slideR);

                // 左側（奇数P）用の独立したスライド
                let slideL = document.createElement('div');
                slideL.className = 'swiper-slide';
                slideL.setAttribute('data-pages', JSON.stringify([i]));
                slideL.setAttribute('data-side', 'left');
                slideL.setAttribute('data-label', `${pageStart + 1}P`);
                wrapper.appendChild(slideL);
            }

            // 裏表紙（21ページ目）
            let backSlide = document.createElement('div');
            backSlide.className = 'swiper-slide single-page';
            backSlide.setAttribute('data-pages', JSON.stringify([totalPages]));
            backSlide.setAttribute('data-side', 'both');
            backSlide.setAttribute('data-label', '裏表紙');
            wrapper.appendChild(backSlide);
        } else {
            // 💻PC：1枚ずつの見開きスライドとして生成
            for (let i = 1; i <= totalPages; i++) {
                const slide = document.createElement('div');
                slide.setAttribute('data-pages', JSON.stringify([i]));
                slide.setAttribute('data-side', 'both');
                if (i === 1) {
                    slide.className = 'swiper-slide single-page';
                    slide.setAttribute('data-label', '表紙');
                } else if (i === totalPages) {
                    slide.className = 'swiper-slide single-page';
                    slide.setAttribute('data-label', '裏表紙');
                } else {
                    slide.className = 'swiper-slide';
                    const pageStart = (i - 1) * 2;
                    slide.setAttribute('data-label', `${pageStart}-${pageStart + 1}P`);
                }
                wrapper.appendChild(slide);
            }
        }
    }

    async function buildThumbnails() {
        thumbsContainer.innerHTML = '';
        const totalPages = pdfDoc.numPages;

        for (let i = 1; i <= totalPages; i++) {
            const thumbBox = document.createElement('div');
            thumbBox.className = 'thumb-box';
            thumbBox.setAttribute('id', `thumb-${i}`);
            thumbsContainer.appendChild(thumbBox);

            thumbBox.onclick = () => {
                if (checkIsMobile()) {
                    if (i === 1) swiperInstance.slideTo(0);
                    else if (i === totalPages) swiperInstance.slideTo(swiperInstance.slides.length - 1);
                    else swiperInstance.slideTo((i - 2) * 2 + 1);
                } else {
                    swiperInstance.slideTo(i - 1);
                }
            };

            setTimeout(async () => {
                try {
                    const page = await pdfDoc.getPage(i);
                    const vp = page.getViewport({ scale: 0.1 });
                    const canvas = document.createElement('canvas');
                    canvas.width = vp.width; canvas.height = vp.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                    thumbBox.appendChild(canvas);
                } catch (e) { console.error(e); }
            }, i * 20);
        }
    }

    function updateThumbnailActive(swiperInstance) {
        document.querySelectorAll('.thumb-box').forEach(t => t.classList.remove('active'));
        
        const activeSlide = swiperInstance.slides[swiperInstance.activeIndex];
        const pages = JSON.parse(activeSlide.getAttribute('data-pages'));

        pages.forEach(pNum => {
            const activeThumb = document.getElementById(`thumb-${pNum}`);
            if (activeThumb) {
                activeThumb.classList.add('active');
                thumbsContainer.scrollTo({
                    left: activeThumb.offsetLeft - thumbsContainer.offsetWidth / 2 + activeThumb.offsetWidth / 2,
                    behavior: 'smooth'
                });
            }
        });
    }

    function initSwiper() {
        if (swiperInstance) swiperInstance.destroy(true, true);

        swiperInstance = new Swiper('.swiper', {
            rtl: true,
            loop: false,
            speed: 500, 
            grabCursor: true,
            slidesPerView: 1,
            effect: 'creative',
            creativeEffect: {
                prev: { shadow: true, translate: [0, 0, -400] },
                next: { translate: ['-100%', 0, 0] },
            },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            keyboard: { enabled: true },
            on: {
                init: function () {
                    loadVisiblePages(this);
                    updateCounter(this);
                    updateThumbnailActive(this);
                },
                slideChange: function () {
                    loadVisiblePages(this);
                    updateCounter(this);
                    updateThumbnailActive(this);
                }
            }
        });
    }

    function updateCounter(swiperInstance) {
        const activeSlide = swiperInstance.slides[swiperInstance.activeIndex];
        const label = activeSlide.getAttribute('data-label');
        document.getElementById('current-page').textContent = label;
    }

    async function loadVisiblePages(swiperInstance) {
        const activeIndex = swiperInstance.activeIndex;
        const targets = [activeIndex - 1, activeIndex, activeIndex + 1];

        for (const index of targets) {
            if (index >= 0 && index < swiperInstance.slides.length) {
                const slide = swiperInstance.slides[index];
                const pages = JSON.parse(slide.getAttribute('data-pages'));
                
                for (const pNum of pages) {
                    await renderPageToCanvas(pNum, slide);
                }
                swiperInstance.update(); 
            }
        }
    }

    pdfjsLib.getDocument(pdfUrl).promise.then(async function(pdf) {
        pdfDoc = pdf;
        
        const actualTotalPages = (pdf.numPages - 2) * 2 + 2;
        document.getElementById('total-pages').textContent = actualTotalPages + "P";

        buildSlides();
        await buildThumbnails(); 
        
        document.getElementById('loading').style.display = 'none';
        document.querySelector('.swiper').style.display = 'block';
        document.getElementById('counter-box').style.display = 'block';

        initSwiper();

        let lastMode = checkIsMobile();
        window.addEventListener('resize', function() {
            const currentMode = checkIsMobile();
            if (currentMode !== lastMode) {
                buildSlides();
                initSwiper();
                lastMode = currentMode;
            }
        });

    }).catch(function(error) {
        console.error('PDF読み込みエラー: ', error);
        document.getElementById('loading').textContent = '読み込みに失敗しました。';
    });
</script>

</body>
</html>
